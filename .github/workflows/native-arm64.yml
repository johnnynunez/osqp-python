name: Native ARM64 verification
on:
  push:
    branches: [ci/native-arm64-optimization-20261011]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: pin
            sha: 292515f3df660e8cb27fef100518acbde5766295
          - mode: current
            sha: 66e35a567578dda90911b9a7917e8eead1e3455e
    env:
      CMAKE_GENERATOR: Ninja Multi-Config
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: johnnynunez/osqp-python
          ref: ${{ matrix.sha }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Isolated caches
        shell: pwsh
        run: |
          foreach ($name in @('PIP_CACHE_DIR','UV_CACHE_DIR','UV_PYTHON_INSTALL_DIR','UV_PYTHON_BIN_DIR','NUGET_PACKAGES','NUGET_HTTP_CACHE_PATH','NUGET_PLUGINS_CACHE_PATH','VIRTUALENV_OVERRIDE_APP_DATA')) {
            "$name=$env:RUNNER_TEMP/optimization-cache/$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build installed wheel and run numerical and upstream tests
        run: python harness/run_native.py osqp ${{ matrix.mode }} ${{ matrix.sha }}
      - name: Upload wheels and complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-osqp-${{ matrix.mode }}
          path: ${{ github.workspace }}/evidence/
          if-no-files-found: error
